<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Maged Badawi — Biomedical Engineer, AI and Software Engineer portfolio.">
<title>Maged Badawi | Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#f0f4f8;--card-color:#fff;--text-color:#2d3748;--primary-color:#2c5282;--secondary-color:#4a5568;--highlight-color:#3182ce;--light-grey:#e2e8f0;--dark-grey:#4a5568;--accent-color:#90cdf4;--gradient-start:#2c5282;--gradient-end:#2b6cb0}
*{box-sizing:border-box}body{margin:0;background:var(--bg-color);color:var(--text-color);font-family:Inter,'Segoe UI',Arial,sans-serif;line-height:1.6;padding:20px;min-height:100vh;display:flex;justify-content:center;align-items:center}html[lang=ar] body{font-family:Cairo,Arial,sans-serif}.card-container{max-width:960px;width:100%;display:flex;flex-direction:column;gap:20px}.top-card{background:var(--card-color);border-radius:16px;box-shadow:0 10px 30px #00000014;overflow:hidden;display:flex;flex-direction:column}.left-column{padding:40px;background:linear-gradient(135deg,var(--gradient-start),var(--gradient-end));color:white;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.right-column{flex:2;padding:40px;min-width:0}.language-switcher{position:absolute;top:20px;right:20px;display:flex;gap:10px;z-index:2}.lang-btn{background:#ffffff33;border:0;font-size:14px;cursor:pointer;padding:5px 10px;border-radius:6px;color:white}.lang-btn.active{background:white;color:var(--primary-color);font-weight:700}.profile-img-container{margin:15px 0 25px}.profile-img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #ffffff4d;box-shadow:0 8px 20px #0002;background:#ffffff33;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}.name{font-size:28px;font-weight:700;margin:0 0 8px}.title{font-size:16px;opacity:.9;margin:0 0 25px;max-width:250px}.contact-info{display:flex;flex-direction:column;gap:15px;margin-top:30px;width:100%;text-align:left;direction:ltr}.contact-item{display:flex;align-items:center;gap:10px;font-size:14px;overflow-wrap:anywhere}.contact-item i{width:25px;font-size:18px}.social-links{display:flex;gap:15px;margin-top:40px;justify-content:center}.social-link{color:white;font-size:22px;width:45px;height:45px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.2s}.social-link:hover{transform:translateY(-3px);background:#ffffff40}.content-scrollable{max-height:500px;overflow-y:auto;padding-inline-end:15px;scroll-behavior:smooth}.content-scrollable::-webkit-scrollbar{width:6px}.content-scrollable::-webkit-scrollbar-track{background:var(--light-grey);border-radius:8px}.content-scrollable::-webkit-scrollbar-thumb{background:var(--accent-color);border-radius:8px}.section{margin-bottom:30px}.section-title{font-size:18px;font-weight:600;margin:0 0 15px;color:var(--primary-color);display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--light-grey)}.section-title i{font-size:20px}.divider{height:1px;background:var(--light-grey);margin:20px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary-color);color:white;text-decoration:none;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;border:0;cursor:pointer;transition:.2s;margin-inline-end:10px;margin-bottom:10px;box-shadow:0 4px 10px #2c528233;font-family:inherit}.btn:hover{background:var(--highlight-color);transform:translateY(-2px)}.skills-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.skill-tag{background:var(--light-grey);padding:8px 16px;border-radius:30px;font-size:13px;font-weight:500;color:var(--secondary-color)}.more-toggle{cursor:pointer;border:0;font-family:inherit}.skill-tag:hover{background:var(--accent-color);color:var(--primary-color)}.experience-item{margin-bottom:25px;position:relative;padding-inline-start:25px}.experience-item::before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:var(--primary-color);inset-inline-start:0;top:6px}.experience-item::after{content:'';position:absolute;width:2px;height:calc(100% + 10px);background:var(--light-grey);inset-inline-start:5px;top:12px}.experience-item:last-of-type::after{display:none}.experience-title{font-weight:600;font-size:16px;margin-bottom:5px;color:var(--dark-grey)}.experience-company{font-size:14px;margin-bottom:3px;font-weight:500}.experience-date{font-size:13px;color:var(--secondary-color);margin-bottom:8px;display:block}.experience-highlights ul{list-style:none;padding:0;margin:8px 0;font-size:14px}.experience-highlights li{position:relative;padding-inline-start:20px;margin-bottom:5px;line-height:1.5}.experience-highlights li::before,.simple-list li::before{content:'•';position:absolute;inset-inline-start:5px;color:var(--highlight-color);font-size:18px}.experience-specialization{font-size:14px;font-style:italic;margin-top:5px;color:var(--secondary-color)}.skills-category{margin-bottom:20px}.skills-category h4{font-size:16px;margin:0 0 10px;color:var(--primary-color);font-weight:500}.flag-icon{display:inline-flex;align-items:center;justify-content:center;margin-inline-end:8px;width:23px;height:23px;font-size:10px;border-radius:50%;color:white;background:var(--primary-color);font-weight:600}.content-card{background:var(--card-color);border-radius:16px;box-shadow:0 10px 30px #00000014;padding:30px;margin-bottom:0}.content-card-header{font-size:20px;font-weight:600;margin:0 0 20px;color:var(--primary-color);border-bottom:2px solid var(--light-grey);padding-bottom:10px;display:flex;align-items:center;gap:10px}.simple-list{list-style:none;padding:0;margin:0}.simple-list li{position:relative;padding-inline-start:20px;margin-bottom:10px;line-height:1.5;font-size:14px}.two-cols{display:flex;flex-wrap:wrap;gap:30px}.two-cols>div{flex:1;min-width:240px}.two-cols h4{color:var(--primary-color);margin:0 0 15px}.center{text-align:center}.error{padding:30px;text-align:center}html[dir=rtl] .right-column,html[dir=rtl] .content-card{text-align:right}html[dir=rtl] .language-switcher{right:auto;left:20px}html[dir=rtl] .left-column{direction:ltr}html[dir=rtl] .title{direction:rtl}html[dir=rtl] .experience-company,html[dir=rtl] .experience-date{unicode-bidi:plaintext}html[dir=rtl] .contact-info{direction:ltr;text-align:left}
@media(min-width:768px){.top-card{flex-direction:row;align-items:stretch}.left-column{min-width:300px;max-width:300px}}
@media(max-width:768px){.left-column,.right-column{padding:30px 20px}.profile-img{width:120px;height:120px}.content-scrollable{max-height:none;padding-inline-end:0}.social-links{margin-top:20px}.language-switcher{top:15px;right:15px}}
@media(max-width:480px){body{padding:10px}.top-card{border-radius:12px}.left-column,.right-column{padding:25px 15px}.profile-img{width:100px;height:100px}.name{font-size:24px}.btn{width:100%;margin-inline-end:0}.content-card{padding:20px}}
@media print{body{padding:0;background:white}.card-container{max-width:100%}.top-card,.content-card{box-shadow:none;border:1px solid #ddd}.content-scrollable{max-height:none;overflow:visible}.language-switcher,.more-toggle,.experience-toggle{display:none!important}}
</style>
</head>
<body><main class="card-container" id="business-card" aria-live="polite"></main>
<script>
'use strict';
let configData=null;
let showAllExperience=false;
const expandedSkills=new Set();
let currentLanguage=localStorage.getItem('portfolio-language')==='ar'?'ar':'en';
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=value=>typeof value==='string'?value:String(value?.[currentLanguage]??value?.en??'');
const safeUrl=value=>{const s=String(value??'').trim();if(/^(https?:\/\/|mailto:|tel:)/i.test(s)||(!/^[a-z][\w+.-]*:/i.test(s)&&!s.startsWith('//')))return escapeHtml(s);return '#';};
const icon=(cls)=>`<i class="${escapeHtml(cls)}" aria-hidden="true"></i>`;
const heading=(entry,fallback)=>`<h3 class="section-title">${icon(entry?.icon||fallback)}<span>${escapeHtml(tr(entry))}</span></h3>`;
const section=(entry,fallback,body)=>`<section class="section">${heading(entry,fallback)}${body}</section>`;
const list=items=>`<ul class="simple-list">${(items||[]).map(x=>`<li>${escapeHtml(tr(x))}</li>`).join('')}</ul>`;
const dates=item=>`<span class="experience-date" dir="auto">${escapeHtml(item.startDate||'')}${item.endDate?' – '+escapeHtml(item.endDate):''}</span>`;
function experienceItem(job){return `<article class="experience-item"><div class="experience-title">${escapeHtml(tr(job.title))}</div><div class="experience-company" dir="auto">${escapeHtml(job.company||'')}${job.location?', '+escapeHtml(job.location):''}</div>${dates(job)}${job.highlights?.length?`<div class="experience-highlights"><ul>${job.highlights.map(h=>`<li>${escapeHtml(tr(h))}</li>`).join('')}</ul></div>`:''}</article>`;}
function experienceSection(c){if(!c.experience?.length)return '';const jobs=showAllExperience?c.experience:c.experience.slice(0,3);const button=c.experience.length>3?`<div class="center"><button class="btn experience-toggle" type="button" data-action="experience" aria-expanded="${showAllExperience}">${icon(showAllExperience?'fas fa-minus-circle':'fas fa-plus-circle')}<span>${currentLanguage==='ar'?(showAllExperience?'إخفاء الخبرات':'عرض جميع الخبرات'):(showAllExperience?'Hide Experience':'View All Experience')}</span></button></div>`:'';return section(c.sections.experience,'fas fa-briefcase',jobs.map(experienceItem).join('')+button);}
function educationSection(c){if(!c.education?.length)return '';return section(c.sections.education,'fas fa-graduation-cap',c.education.map(e=>`<article class="experience-item"><div class="experience-title">${escapeHtml(tr(e.degree))}</div><div class="experience-company" dir="auto">${escapeHtml(e.institution||'')}${e.location?', '+escapeHtml(e.location):''}</div>${dates(e)}${e.specialization?`<div class="experience-specialization">${escapeHtml(tr(e.specialization))}</div>`:''}</article>`).join(''));}
function skillsSection(c){if(!c.skills)return '';const content=Object.entries(c.skills).map(([key,skills])=>{const expanded=expandedSkills.has(key);const shown=expanded?skills:skills.slice(0,6);const extra=skills.length-6;return `<div class="skills-category"><h4>${escapeHtml(tr(c.skillCategories?.[key]||key))}</h4><div class="skills-list">${shown.map(s=>`<span class="skill-tag">${escapeHtml(tr(s))}</span>`).join('')}${extra>0?`<button type="button" class="skill-tag more-toggle" data-action="skills" data-category="${escapeHtml(key)}" aria-expanded="${expanded}">${expanded?(currentLanguage==='ar'?'عرض أقل':'Show less'):(currentLanguage==='ar'?`عرض ${extra} مهارات إضافية`:`+${extra} more`)}</button>`:''}</div></div>`;}).join('');return section(c.sections.skills,'fas fa-cogs',content);}
function languageSection(c){if(!c.languageSkills?.length)return '';return section(c.sections.languageSkills,'fas fa-language',`<div class="skills-list">${c.languageSkills.map(l=>`<span class="skill-tag"><span class="flag-icon">${escapeHtml((l.code||'').toUpperCase())}</span>${escapeHtml(tr(l.display)||l.name)}</span>`).join('')}</div>`);}
function resumeSection(c){if(!c.resume)return '';const r=c.resume;const view=r.viewPath?.[currentLanguage]||r.viewPath?.en;const download=r.downloadPath?.[currentLanguage]||r.downloadPath?.en;return section(c.sections.resume,'fas fa-file-alt',`<a class="btn" href="${safeUrl(view)}" target="_blank" rel="noopener noreferrer">${icon('fas fa-eye')}${escapeHtml(tr(r.viewText)||'View Resume')}</a><a class="btn" href="${safeUrl(download)}" download>${icon('fas fa-download')}${escapeHtml(tr(r.downloadText)||'Download')}</a>`);}
function contentCard(title,body,iconClass){return `<section class="content-card"><h3 class="content-card-header">${icon(iconClass)}<span>${escapeHtml(title)}</span></h3>${body}</section>`;}
function render(){const c=configData;if(!c)return;document.documentElement.lang=currentLanguage;document.documentElement.dir=currentLanguage==='ar'?'rtl':'ltr';document.title=`${c.basicInfo?.name||'Portfolio'} | ${currentLanguage==='ar'?'الملف المهني':'Portfolio'}`;const contact=c.contact||{};const social=(c.social||[]).map(s=>`<a class="social-link" href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(s.platform)}" title="${escapeHtml(s.platform)}">${icon(s.icon||'fas fa-link')}</a>`).join('');const initials=(c.basicInfo?.name||'').split(/\s+/).map(x=>x[0]||'').join('').toUpperCase();const photo=c.basicInfo?.profileImage?`<img class="profile-img" src="${safeUrl(c.basicInfo.profileImage)}" alt="${escapeHtml(c.basicInfo.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="profile-img" style="display:none">${escapeHtml(initials)}</div>`:`<div class="profile-img">${escapeHtml(initials)}</div>`;const info=[['fas fa-envelope',contact.email,`mailto:${contact.email||''}`],['fas fa-phone',contact.phone,`tel:${(contact.phone||'').replace(/\s/g,'')}`],['fas fa-map-marker-alt',contact.address,null]].filter(x=>x[1]).map(([i,v,href])=>`<div class="contact-item">${icon(i)}${href?`<a href="${safeUrl(href)}" style="color:inherit;text-decoration:none">${escapeHtml(v)}</a>`:`<span>${escapeHtml(v)}</span>`}</div>`).join('');const main=`${c.summary?section(c.sections.summary,'fas fa-user',`<p>${escapeHtml(tr(c.summary))}</p>`):''}<div class="divider"></div>${experienceSection(c)}${educationSection(c)}${skillsSection(c)}${languageSection(c)}${resumeSection(c)}`;let extra='';if(c.projects?.length)extra+=contentCard(tr(c.sections.projects),list(c.projects),c.sections.projects?.icon||'fas fa-file-alt');if(c.certifications?.length||c.competitions?.length){const columns=`<div class="two-cols">${c.certifications?.length?`<div><h4>${escapeHtml(tr(c.sections.certifications))}</h4>${list(c.certifications)}</div>`:''}${c.competitions?.length?`<div><h4>${escapeHtml(tr(c.sections.competitions))}</h4>${list(c.competitions)}</div>`:''}</div>`;extra+=contentCard(currentLanguage==='ar'?'الشهادات والإنجازات':'Certifications & Achievements',columns,'fas fa-certificate');}if(c.volunteering?.length)extra+=contentCard(tr(c.sections.volunteering),list(c.volunteering),c.sections.volunteering?.icon||'fas fa-hands-helping');document.getElementById('business-card').innerHTML=`<div class="top-card"><aside class="left-column"><div class="language-switcher" role="group" aria-label="Language">${(c.languages||[{code:'en',label:'EN'},{code:'ar',label:'AR'}]).map(l=>`<button type="button" class="lang-btn ${l.code===currentLanguage?'active':''}" data-action="language" data-lang="${escapeHtml(l.code)}" aria-pressed="${l.code===currentLanguage}">${escapeHtml(l.label)}</button>`).join('')}</div><div class="profile-img-container">${photo}</div><h1 class="name">${escapeHtml(c.basicInfo?.name)}</h1><p class="title">${escapeHtml(tr(c.basicInfo?.title))}</p><div class="contact-info">${info}</div><div class="social-links">${social}</div></aside><div class="right-column"><div class="content-scrollable" id="content-scrollable">${main}</div></div></div>${extra}`;}
function applyThemeColors(colors){for(const [key,value] of Object.entries(colors||{})){if(/^#[0-9a-f]{3,8}$/i.test(value))document.documentElement.style.setProperty('--'+key,value);}if(colors?.['primary-color'])document.documentElement.style.setProperty('--gradient-start',colors['primary-color']);if(colors?.['highlight-color'])document.documentElement.style.setProperty('--gradient-end',colors['highlight-color']);}
document.getElementById('business-card').addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;const scroll=document.getElementById('content-scrollable');const oldScroll=scroll?.scrollTop||0;if(action==='language'){if(!['en','ar'].includes(btn.dataset.lang))return;currentLanguage=btn.dataset.lang;localStorage.setItem('portfolio-language',currentLanguage);}else if(action==='experience'){showAllExperience=!showAllExperience;}else if(action==='skills'){const key=btn.dataset.category;if(expandedSkills.has(key))expandedSkills.delete(key);else expandedSkills.add(key);}render();const next=document.getElementById('content-scrollable');if(next)next.scrollTop=oldScroll;});
async function loadConfig(){try{const response=await fetch('config.json?nocache='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);configData=await response.json();applyThemeColors(configData.themeColors);render();}catch(error){console.error('Error loading config:',error);document.getElementById('business-card').innerHTML='<div class="content-card error"><h2>Unable to load portfolio</h2><p>Check that config.json is present and valid, and open the site through a local server or hosting provider.</p></div>';}}
document.addEventListener('DOMContentLoaded',loadConfig);
</script>
</body></html>
